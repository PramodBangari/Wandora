<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wandora — Explore Activities</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#f5f6f8;color:#18202a}
header{height:68px;background:#fff;border-bottom:1px solid #e5e8ed;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:1000}
.logo{font-size:25px;font-weight:800;letter-spacing:-1px}.logo span{color:#ff6848}
.nav{display:flex;gap:5px}.nav button{border:0;background:none;padding:10px 12px;border-radius:9px;cursor:pointer;color:#5d6674}.nav .active{background:#fff0ec;color:#e84f30;font-weight:700}
.primary{border:0;background:#ff6848;color:#fff;padding:10px 15px;border-radius:9px;font-weight:700;cursor:pointer}.primary:hover{background:#ed5b3c}
main{max-width:1400px;margin:auto;padding:24px}
.hero{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.hero h1{margin:0;font-size:28px}.hero p{color:#697386;margin:6px 0}
.controls{background:#fff;border:1px solid #e5e8ed;border-radius:14px;padding:12px;display:flex;gap:10px;margin-bottom:18px}
.search,select{border:1px solid #dfe3e8;border-radius:9px;padding:11px;background:#fff}.search{flex:1}
.layout{display:grid;grid-template-columns:420px 1fr;gap:18px}.panel{background:#fff;border:1px solid #e5e8ed;border-radius:14px;overflow:hidden}
.panelhead{padding:15px 17px;border-bottom:1px solid #eee;display:flex;justify-content:space-between}.panelhead span{color:#697386;font-size:12px}
.list{height:650px;overflow:auto}.card{padding:15px 17px;border-bottom:1px solid #f0f1f3;cursor:pointer}.card:hover,.card.selected{background:#fff8f5}.card h3{margin:0 0 6px;font-size:14px}.meta{font-size:12px;color:#687386;line-height:1.7}.tag{display:inline-block;background:#f1f3f6;padding:4px 8px;border-radius:999px;font-size:10px;margin-top:7px}
.map{height:650px}.empty{text-align:center;padding:60px 25px;color:#697386}.empty h3{color:#18202a}
.modal{display:none;position:fixed;inset:0;background:#0005;z-index:2000;align-items:center;justify-content:center}.modal.show{display:flex}
.box{background:#fff;width:min(560px,92vw);border-radius:16px;padding:22px}.box h2{margin:0 0 18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid input,.grid textarea,.grid select{width:100%;border:1px solid #dfe3e8;border-radius:8px;padding:10px}.grid textarea{grid-column:1/-1;min-height:85px}.full{grid-column:1/-1}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.secondary{border:1px solid #ddd;background:#fff;padding:10px 14px;border-radius:9px;cursor:pointer}
.auth-actions{display:flex;align-items:center;gap:8px}.user-pill{border:1px solid #e5e8ed;background:#fff;padding:8px 11px;border-radius:999px;cursor:pointer;font-weight:700}.profile-avatar{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#ffe7df;color:#d94f32;font-size:12px;margin-right:5px}.toast{position:fixed;right:20px;bottom:20px;background:#18202a;color:#fff;padding:12px 16px;border-radius:9px;display:none;z-index:3000}
@media(max-width:900px){.layout{grid-template-columns:1fr}.list,.map{height:500px}.nav{display:none}}
@media(max-width:600px){main{padding:14px}.controls{flex-wrap:wrap}.search{flex-basis:100%}.grid{grid-template-columns:1fr}.hero{gap:10px}}
</style>
</head>
<body>
<header>
  <div class="logo">Wan<span>d</span>ora</div>
  <nav class="nav">
    <button class="nav-btn active" data-view="explore" onclick="switchView('explore')">Explore</button>
    <button class="nav-btn" data-view="activities" onclick="switchView('activities')">Activities</button>
    <button class="nav-btn" onclick="comingSoon('People')">People</button>
    <button class="nav-btn" onclick="comingSoon('Messages')">Messages</button>
    <button class="nav-btn" onclick="comingSoon('My Trips')">My Trips</button>
  </nav>
  <div class="auth-actions">
    <button id="loginBtn" class="secondary" onclick="openAuthModal()">Log in</button>
    <button id="profileBtn" class="user-pill" style="display:none" onclick="openProfileModal()"></button>
    <button class="primary" onclick="openModal()">+ Create Activity</button>
  </div>
</header>

<main>
  <section class="hero">
    <div>
      <h1 id="pageTitle">Explore activities</h1>
      <p id="pageSubtitle">Discover what's happening around Bengaluru and meet fellow travelers.</p>
    </div>
    <strong id="count">0 activities</strong>
  </section>

  <div class="controls">
    <input id="search" class="search" placeholder="Search activity or location...">
    <select id="category"><option value="">All categories</option></select>
  </div>

  <div class="layout">
    <section class="panel">
      <div class="panelhead"><b>Activities</b><span id="status">Loading...</span></div>
      <div id="list" class="list"></div>
    </section>
    <section class="panel">
      <div id="map" class="map"></div>
    </section>
  </div>
</main>

<div id="modal" class="modal">
  <div class="box">
    <h2>Create an activity</h2>
    <form id="form">
      <div class="grid">
        <input name="title" placeholder="Activity name" required>

        <select name="category" id="createCategory" required></select>

        <select name="location_name" id="createLocation" class="full" required>
          <option value="">Select Bengaluru location</option>
        </select>

        <input name="start_time" placeholder="Saturday • 7:00 PM" required>
        <input name="max_participants" type="number" min="1" value="10" placeholder="Max participants">

        <textarea name="description" placeholder="Tell travelers what this activity is about..."></textarea>
      </div>

      <div class="actions">
        <button type="button" class="secondary" onclick="closeModal()">Cancel</button>
        <button class="primary">Create Activity</button>
      </div>
    </form>
  </div>
</div>

<div id="authModal" class="modal">
  <div class="box">
    <h2 id="authTitle">Log in to Wandora</h2>
    <p id="authSubtitle" style="color:#697386">Join activities and create your profile.</p>
    <form id="authForm">
      <div class="grid">
        <input id="authUsername" name="username" placeholder="Username" style="display:none">
        <input id="authEmail" name="email" type="email" placeholder="Email" required class="full">
        <input id="authPassword" name="password" type="password" placeholder="Password (min 6 characters)" required class="full">
        <input id="authCity" name="city" value="Bengaluru" placeholder="City" style="display:none" class="full">
      </div>
      <div class="actions">
        <button type="button" class="secondary" onclick="closeAuthModal()">Cancel</button>
        <button class="primary" id="authSubmit">Log in</button>
      </div>
    </form>
    <p style="text-align:center;margin:16px 0 0">
      <button type="button" class="secondary" id="authSwitch" onclick="toggleAuthMode()">Create an account</button>
    </p>
  </div>
</div>

<div id="profileModal" class="modal">
  <div class="box">
    <h2>Your profile</h2>
    <form id="profileForm">
      <div class="grid">
        <input name="username" id="profileUsername" placeholder="Username" required>
        <input name="city" id="profileCity" placeholder="City">
        <input name="interests" id="profileInterests" placeholder="Interests (e.g. travel, trekking, food)" class="full">
        <input name="avatar_url" id="profileAvatar" placeholder="Profile photo URL (optional)" class="full">
        <textarea name="bio" id="profileBio" placeholder="Tell people a little about you..."></textarea>
      </div>
      <div class="actions">
        <button type="button" class="secondary" onclick="logout()">Log out</button>
        <button type="button" class="secondary" onclick="closeProfileModal()">Cancel</button>
        <button class="primary">Save Profile</button>
      </div>
    </form>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const API="/api/activities";
const AUTH="/api/auth";
let authMode="login";
let currentUser=null;

const categories=[
  "Food","Trekking","Cafe","Photography","Music",
  "Nightlife","Sports","Travel","Wellness","Games","Dinner"
];

const bengaluruLocations=[
  "Indiranagar","Koramangala","HSR Layout","Whitefield","Bellandur",
  "Marathahalli","Brookfield","Hebbal","MG Road","Jayanagar","JP Nagar",
  "Electronic City","Yelahanka","Rajajinagar","Malleshwaram","BTM Layout",
  "Banashankari","Kalyan Nagar","Kundalahalli","Cubbon Park","Lalbagh",
  "Bangalore Palace","Church Street","Richmond Town","Frazer Town",
  "JP Nagar 7th Phase","Sarjapur Road","Manyata Tech Park","Devanahalli"
];

const category=document.getElementById("category");
const createCategory=document.getElementById("createCategory");
const createLocation=document.getElementById("createLocation");
const list=document.getElementById("list");

categories.forEach(x=>{
  category.insertAdjacentHTML("beforeend",`<option value="${x}">${x}</option>`);
  createCategory.insertAdjacentHTML("beforeend",`<option value="${x}">${x}</option>`);
});

bengaluruLocations.forEach(x=>{
  createLocation.insertAdjacentHTML("beforeend",`<option value="${x}">${x}</option>`);
});

const map=L.map("map").setView([12.9716,77.5946],11);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
  attribution:"© OpenStreetMap contributors"
}).addTo(map);

let markers=[];
let currentActivities=[];
let currentView="explore";

function token(){ return localStorage.getItem("wandora_token"); }

function authHeaders(json=false){
  const headers={};
  if(json) headers["Content-Type"]="application/json";
  const t=token();
  if(t) headers["Authorization"]=`Bearer ${t}`;
  return headers;
}

async function refreshUser(){
  const t=token();
  if(!t){ updateAuthUI(); return; }
  try{
    const response=await fetch(`${AUTH}/me`,{headers:authHeaders()});
    if(!response.ok) throw new Error("session expired");
    currentUser=await response.json();
  }catch(e){
    localStorage.removeItem("wandora_token");
    currentUser=null;
  }
  updateAuthUI();
}

function updateAuthUI(){
  const loginBtn=document.getElementById("loginBtn");
  const profileBtn=document.getElementById("profileBtn");
  if(currentUser){
    loginBtn.style.display="none";
    profileBtn.style.display="inline-flex";
    const initial=escapeHtml(currentUser.username.slice(0,1).toUpperCase());
    profileBtn.innerHTML=`<span class="profile-avatar">${initial}</span>${escapeHtml(currentUser.username)}`;
  }else{
    loginBtn.style.display="inline-block";
    profileBtn.style.display="none";
  }
}

function openAuthModal(){
  document.getElementById("authModal").classList.add("show");
  setAuthMode("login");
}
function closeAuthModal(){document.getElementById("authModal").classList.remove("show")}
function setAuthMode(mode){
  authMode=mode;
  const register=mode==="register";
  document.getElementById("authTitle").textContent=register?"Create your Wandora account":"Log in to Wandora";
  document.getElementById("authSubtitle").textContent=register?"Create a profile and start meeting people.":"Join activities and create your profile.";
  document.getElementById("authUsername").style.display=register?"block":"none";
  document.getElementById("authCity").style.display=register?"block":"none";
  document.getElementById("authUsername").required=register;
  document.getElementById("authCity").required=false;
  document.getElementById("authSubmit").textContent=register?"Create account":"Log in";
  document.getElementById("authSwitch").textContent=register?"I already have an account":"Create an account";
}
function toggleAuthMode(){setAuthMode(authMode==="login"?"register":"login")}

async function submitAuth(e){
  e.preventDefault();
  const form=e.target;
  const body=Object.fromEntries(new FormData(form));
  try{
    const response=await fetch(`${AUTH}/${authMode==="register"?"register":"login"}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    const data=await response.json();
    if(!response.ok){toast(data.detail||"Authentication failed");return;}
    localStorage.setItem("wandora_token",data.access_token);
    currentUser=data.user;
    updateAuthUI();
    closeAuthModal();
    form.reset();
    document.getElementById("authCity").value="Bengaluru";
    toast(authMode==="register"?"Welcome to Wandora 🎉":"Welcome back 🎉");
    load();
  }catch(e){toast("Could not connect to server")}
}

async function openProfileModal(){
  await refreshUser();
  if(!currentUser){openAuthModal();return;}
  document.getElementById("profileUsername").value=currentUser.username||"";
  document.getElementById("profileCity").value=currentUser.city||"Bengaluru";
  document.getElementById("profileInterests").value=currentUser.interests||"";
  document.getElementById("profileAvatar").value=currentUser.avatar_url||"";
  document.getElementById("profileBio").value=currentUser.bio||"";
  document.getElementById("profileModal").classList.add("show");
}
function closeProfileModal(){document.getElementById("profileModal").classList.remove("show")}
function logout(){
  localStorage.removeItem("wandora_token");
  currentUser=null;
  updateAuthUI();
  closeProfileModal();
  toast("Logged out");
}

function switchView(view){
  currentView=view;
  document.querySelectorAll(".nav-btn").forEach(btn=>{
    btn.classList.toggle("active",btn.dataset.view===view);
  });

  const title=document.getElementById("pageTitle");
  const subtitle=document.getElementById("pageSubtitle");

  if(view==="activities"){
    title.textContent="Activities";
    subtitle.textContent="Browse activities created by the Wandora community.";
  }else{
    title.textContent="Explore activities";
    subtitle.textContent="Discover what's happening around Bengaluru and meet fellow travelers.";
  }

  load();
}

function comingSoon(name){
  toast(`${name} is coming next 🚀`);
}


async function load(){
  try{
    const q=document.getElementById("search").value.trim();
    const c=category.value;
    const params=new URLSearchParams();
    if(q) params.set("q",q);
    if(c) params.set("category",c);

    const response=await fetch(API+"?"+params.toString());
    if(!response.ok) throw new Error("API request failed");

    currentActivities=await response.json();
    render(currentActivities);
    document.getElementById("status").textContent="Live database";
  }catch(error){
    document.getElementById("status").textContent="API error";
    list.innerHTML=`<div class="empty"><h3>Could not load activities</h3><p>Make sure FastAPI is running.</p></div>`;
  }
}

function render(data){
  document.getElementById("count").textContent=`${data.length} ${data.length===1?"activity":"activities"}`;

  markers.forEach(m=>m.remove());
  markers=[];

  if(data.length===0){
    list.innerHTML=`
      <div class="empty">
        <h3>No activities yet</h3>
        <p>${currentView === "activities" ? "No community activities have been created yet." : "Be the first person to create an activity on Wandora."}</p>
        <div class="auth-actions">
    <button id="loginBtn" class="secondary" onclick="openAuthModal()">Log in</button>
    <button id="profileBtn" class="user-pill" style="display:none" onclick="openProfileModal()"></button>
    <button class="primary" onclick="openModal()">+ Create Activity</button>
  </div>
      </div>`;
    map.setView([12.9716,77.5946],11);
    return;
  }

  list.innerHTML=data.map(a=>`
    <div class="card" data-id="${a.id}" onclick="focusActivity(${a.id})">
      <h3>${escapeHtml(a.title)}</h3>
      <div class="meta">
        📍 ${escapeHtml(a.location_name)}<br>
        🕒 ${escapeHtml(a.start_time)}<br>
        👥 ${a.joined}/${a.max_participants} · Host: ${escapeHtml(a.host)}
      </div>
      <span class="tag">${escapeHtml(a.category)}</span>
    </div>
  `).join("");

  data.forEach(a=>{
    const marker=L.marker([a.latitude,a.longitude])
      .addTo(map)
      .bindPopup(`
        <b>${escapeHtml(a.title)}</b><br>
        📍 ${escapeHtml(a.location_name)}<br>
        🕒 ${escapeHtml(a.start_time)}<br>
        👥 ${a.joined}/${a.max_participants}<br>
        <button onclick="joinActivity(${a.id})">Join Activity</button>
      `);

    marker.activityId=a.id;
    markers.push(marker);
  });

  if(data.length===1){
    map.setView([data[0].latitude,data[0].longitude],14);
  }else{
    map.fitBounds(L.latLngBounds(data.map(a=>[a.latitude,a.longitude])),{padding:[25,25]});
  }
}

function focusActivity(id){
  const activity=currentActivities.find(a=>a.id===id);
  if(!activity)return;

  document.querySelectorAll(".card").forEach(c=>{
    c.classList.toggle("selected",Number(c.dataset.id)===id);
  });

  map.setView([activity.latitude,activity.longitude],14);

  const marker=markers.find(m=>m.activityId===id);
  if(marker) marker.openPopup();
}

async function joinActivity(id){
  try{
    if(!currentUser){openAuthModal();toast("Log in to join an activity");return;}
    const response=await fetch(`${API}/${id}/join`,{method:"POST",headers:authHeaders()});
    const data=await response.json();

    if(!response.ok){
      toast(data.detail || "Could not join activity");
      return;
    }

    toast("Joined activity 🎉");
    load();
  }catch(e){
    toast("Could not connect to server");
  }
}

document.getElementById("authForm").addEventListener("submit",submitAuth);

document.getElementById("profileForm").addEventListener("submit",async e=>{
  e.preventDefault();
  if(!currentUser){return;}
  const body=Object.fromEntries(new FormData(e.target));
  try{
    const response=await fetch(`${AUTH}/me`,{method:"PUT",headers:authHeaders(true),body:JSON.stringify(body)});
    const data=await response.json();
    if(!response.ok){toast(data.detail||"Could not update profile");return;}
    currentUser=data;
    updateAuthUI();
    closeProfileModal();
    toast("Profile updated 🎉");
    load();
  }catch(e){toast("Could not connect to server");}
});

document.getElementById("form").addEventListener("submit",async e=>{
  e.preventDefault();

  if(!currentUser){
    closeModal();
    openAuthModal();
    toast("Log in to create an activity");
    return;
  }

  const body=Object.fromEntries(new FormData(e.target));
  body.max_participants=Number(body.max_participants);

  try{
    const response=await fetch(API,{
      method:"POST",
      headers:authHeaders(true),
      body:JSON.stringify(body)
    });

    const data=await response.json();

    if(!response.ok){
      toast(data.detail || "Could not create activity");
      return;
    }

    closeModal();
    e.target.reset();
    createLocation.value="";
    toast("Activity created 🎉");
    load();
  }catch(error){
    toast("Could not connect to server");
  }
});

function openModal(){document.getElementById("modal").classList.add("show")}
function closeModal(){document.getElementById("modal").classList.remove("show")}

function toast(message){
  const t=document.getElementById("toast");
  t.textContent=message;
  t.style.display="block";
  setTimeout(()=>t.style.display="none",2200);
}

function escapeHtml(value){
  return String(value).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

document.getElementById("search").addEventListener("input",load);
category.addEventListener("change",load);

refreshUser().then(load);
</script>
</body>
</html>
