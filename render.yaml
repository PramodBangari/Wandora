services:
  - type: web
    name: wandora
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/activities
    envVars:
      - key: WANDORA_SECRET_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: WANDORA_EMAIL_MODE
        value: smtp
      - key: WANDORA_SMTP_HOST
        sync: false
      - key: WANDORA_SMTP_PORT
        value: 587
      - key: WANDORA_SMTP_USERNAME
        sync: false
      - key: WANDORA_SMTP_PASSWORD
        sync: false
      - key: WANDORA_FROM_EMAIL
        sync: false
      - key: WANDORA_FROM_NAME
        value: Wandora
